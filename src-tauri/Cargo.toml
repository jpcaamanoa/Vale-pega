[package]
name = "cuaderno-clinico"
version = "0.1.0"
description = "Cuaderno clínico personal para psicología clínica independiente"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cuaderno_clinico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1.8.2"
rusqlite_migration = "2.6.0"
argon2 = { version = "0.6.0", features = ["zeroize"] }
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
getrandom = { version = "0.4.3", features = ["std"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
tokio = { version = "1.53.1", features = ["time"] }
uuid = { version = "1.26.0", features = ["rng-getrandom", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
